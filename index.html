<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Grid Challenge - 1 Min</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a2e;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #16213e;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0px 8px 25px rgba(0, 0, 0, 0.5);
            width: 340px;
            text-align: center;
        }
        h2 { margin-top: 0; color: #e94560; }
        .timer-box {
            font-size: 20px;
            font-weight: bold;
            color: #ff6b6b;
            margin: 8px 0;
        }
        .score-box {
            font-size: 18px;
            color: #4ecca3;
            margin: 8px 0;
        }
        /* 3x3 Grid बनावट */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
        }
        .cell {
            background-color: #0f3460;
            height: 70px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .cell.active {
            background-color: #e94560;
            box-shadow: 0 0 15px #e94560;
        }
        .start-btn {
            background-color: #4ecca3;
            color: #1a1a2e;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .start-btn:disabled {
            background-color: #555;
            color: #888;
            cursor: not-allowed;
        }
        input[type="text"] {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #4ecca3;
            background: #0f3460;
            color: #fff;
            border-radius: 5px;
            text-align: center;
            font-size: 16px;
        }
        #gameScreen, #resultScreen { display: none; }
    </style>
</head>
<body>

    <div class="card">
        <!-- नाम दर्ज करने की स्क्रीन -->
        <div id="nameScreen">
            <h2>Grid Challenge</h2>
            <p>1 मिनट में 150 स्कोर बनाएं!<br><small style="color: #ff6b6b;">सावधान: गलत क्लिक पर पॉइंट्स कटेंगे!</small></p>
            <input type="text" id="usernameInput" placeholder="अपना नाम दर्ज करें">
            <button class="start-btn" onclick="startGame()">गेम शुरू करें</button>
            <p id="nameError" style="color: #ff6b6b; font-size: 13px;"></p>
        </div>

        <!-- गेम खेलने की स्क्रीन -->
        <div id="gameScreen">
            <h2>Fast Grid</h2>
            <div class="timer-box">समय शेष: <span id="timer">60</span>s</div>
            <div class="score-box">स्कोर: <span id="currentScore">0</span></div>
            
            <!-- 9 बॉक्स का ग्रिड -->
            <div class="grid" id="gridContainer">
                <div class="cell" onclick="cellClicked(0)"></div>
                <div class="cell" onclick="cellClicked(1)"></div>
                <div class="cell" onclick="cellClicked(2)"></div>
                <div class="cell" onclick="cellClicked(3)"></div>
                <div class="cell" onclick="cellClicked(4)"></div>
                <div class="cell" onclick="cellClicked(5)"></div>
                <div class="cell" onclick="cellClicked(6)"></div>
                <div class="cell" onclick="cellClicked(7)"></div>
                <div class="cell" onclick="cellClicked(8)"></div>
            </div>

            <p style="font-size: 12px; color: #aaa;">चमकते हुए लाल बॉक्स पर ही क्लिक करें!</p>
        </div>

        <!-- रिजल्ट स्क्रीन -->
        <div id="resultScreen">
            <h2>गेम समाप्त!</h2>
            <p id="finalScoreText" style="font-size: 18px; font-weight: bold;"></p>
            <p id="finalResultMsg" style="font-size: 20px; font-weight: bold; margin: 20px 0;"></p>
        </div>
    </div>

    <script>
        // आपका नया और अपडेटेड Apps Script Web URL यहाँ सेट है
        const scriptURL = "https://script.google.com/macros/s/AKfycbwFwb01T8GA8hVK_H8lw3XMXjkY6HBjnzWZE1jccyRPgIGtWBwXeRHX3oMCuYxH69Gksg/exec";
        
        let playerName = "";
        let score = 0;
        let timeLeft = 60;
        let timerInterval = null;
        let gameActive = false;
        let activeIndex = -1;
        let boxInterval = null;

        function startGame() {
            let val = document.getElementById("usernameInput").value.trim();
            if (!val) {
                document.getElementById("nameError").innerText = "कृपया सही नाम लिखें!";
                return;
            }
            playerName = val;
            document.getElementById("nameScreen").style.display = "none";
            document.getElementById("gameScreen").style.display = "block";

            score = 0;
            timeLeft = 60;
            gameActive = true;
            document.getElementById("currentScore").innerText = score;
            document.getElementById("timer").innerText = timeLeft;

            // 1 मिनट का टाइमर
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById("timer").innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    clearInterval(boxInterval);
                    endGame();
                }
            }, 1000);

            // हर 0.8 सेकंड में लाल बॉक्स बदलेगा
            boxInterval = setInterval(lightRandomBox, 800);
        }

        function lightRandomBox() {
            if (!gameActive) return;
            let cells = document.querySelectorAll('.cell');
            
            if (activeIndex >= 0) {
                cells[activeIndex].classList.remove('active');
            }

            activeIndex = Math.floor(Math.random() * 9);
            cells[activeIndex].classList.add('active');
        }

        function cellClicked(index) {
            if (!gameActive) return;
            let cells = document.querySelectorAll('.cell');

            if (index === activeIndex) {
                // सही क्लिक पर अंक मिलें
                score += 10;
                cells[activeIndex].classList.remove('active');
                activeIndex = -1;
            } else {
                // गलत क्लिक पर सीधे माइनस पॉइंट कटेंगे
                score -= 15;
            }
            document.getElementById("currentScore").innerText = score;
        }

        function endGame() {
            gameActive = false;
            if (activeIndex >= 0) {
                document.querySelectorAll('.cell')[activeIndex].classList.remove('active');
            }

            document.getElementById("gameScreen").style.display = "none";
            document.getElementById("resultScreen").style.display = "block";

            document.getElementById("finalScoreText").innerText = "कुल स्कोर: " + score;
            document.getElementById("finalResultMsg").innerText = "डेटा सेव हो रहा है...";

            let payload = {
                playerName: playerName,
                score: score
            };

            fetch(scriptURL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.result === "Winner") {
                    document.getElementById("finalResultMsg").innerText = "🎉 शानदार! आप जीत गए (Winner)!";
                    document.getElementById("finalResultMsg").style.color = "#4ecca3";
                } else {
                    document.getElementById("finalResultMsg").innerText = "❌ आप हार गए (Loss)। टारगेट कठिन था!";
                    document.getElementById("finalResultMsg").style.color = "#ff6b6b";
                }
            })
            .catch(err => {
                if (score >= 150) {
                    document.getElementById("finalResultMsg").innerText = "🎉 शानदार! आप जीत गए (Winner)!";
                    document.getElementById("finalResultMsg").style.color = "#4ecca3";
                } else {
                    document.getElementById("finalResultMsg").innerText = "❌ आप हार गए (Loss)।";
                    document.getElementById("finalResultMsg").style.color = "#ff6b6b";
                }
            });
        }
    </script>
</body>
</html>
