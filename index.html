<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Spin 1-Min Challenge</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.1);
            width: 340px;
            text-align: center;
        }
        h2 { color: #333; margin-top: 0; }
        .timer-box {
            font-size: 22px;
            font-weight: bold;
            color: #d9534f;
            margin: 10px 0;
        }
        .score-box {
            font-size: 18px;
            color: #0275d8;
            margin: 10px 0;
        }
        .wheel {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #f39c12, #e74c3c);
            border-radius: 50%;
            margin: 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.5s ease;
        }
        .spin-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .spin-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        input[type="text"] {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        #gameScreen, #resultScreen { display: none; }
    </style>
</head>
<body>

    <div class="card">
        <!-- नाम डालने की स्क्रीन -->
        <div id="nameScreen">
            <h2>Lucky Spin Challenge</h2>
            <p>1 मिनट में 150 स्कोर बनाएं और जीतें!</p>
            <input type="text" id="usernameInput" placeholder="अपना नाम दर्ज करें">
            <button class="spin-btn" onclick="startGame()">गेम शुरू करें</button>
            <p id="nameError" style="color: red; font-size: 13px;"></p>
        </div>

        <!-- गेम खेलने की स्क्रीन -->
        <div id="gameScreen">
            <h2>Lucky Spin</h2>
            <div class="timer-box">समय शेष: <span id="timer">60</span>s</div>
            <div class="score-box">आपका स्कोर: <span id="currentScore">0</span></div>
            
            <div class="wheel" id="wheelDisplay">SPIN</div>

            <button class="spin-btn" id="spinBtn" onclick="spinWheel()">क्लिक करके स्पिन करें!</button>
        </div>

        <!-- रिजल्ट स्क्रीन -->
        <div id="resultScreen">
            <h2>गेम समाप्त!</h2>
            <p id="finalScoreText" style="font-size: 18px; font-weight: bold;"></p>
            <p id="finalResultMsg" style="font-size: 20px; font-weight: bold; margin: 20px 0;"></p>
        </div>
    </div>

    <script>
        // आपका नया यूआरएल यहाँ जोड़ दिया गया है
        const scriptURL = "https://script.google.com/macros/s/AKfycbz1ddlucQUpObsY3rX3OuE0bMe8GULs32lVZOuXixVS3ARqYTecTnn7Jfnt-v-gUnFwJA/exec";
        
        let playerName = "";
        let score = 0;
        let timeLeft = 60;
        let timerInterval = null;
        let gameActive = false;

        function startGame() {
            let val = document.getElementById("usernameInput").value.trim();
            if (!val) {
                document.getElementById("nameError").innerText = "कृपया सही नाम लिखें!";
                return;
            }
            playerName = val;
            document.getElementById("nameScreen").style.display = "none";
            document.getElementById("gameScreen").style.display = "block";

            score = 0;
            timeLeft = 60;
            gameActive = true;
            document.getElementById("currentScore").innerText = score;
            document.getElementById("timer").innerText = timeLeft;

            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById("timer").innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    endGame();
                }
            }, 1000);
        }

        function spinWheel() {
            if (!gameActive) return;

            let wheel = document.getElementById("wheelDisplay");
            wheel.style.transform = "rotate(" + (Math.random() * 720 + 360) + "deg)";

            let earned = Math.floor(Math.random() * 25) + 10;
            score += earned;
            document.getElementById("currentScore").innerText = score;
        }

        function endGame() {
            gameActive = false;
            document.getElementById("spinBtn").disabled = true;

            document.getElementById("gameScreen").style.display = "none";
            document.getElementById("resultScreen").style.display = "block";

            document.getElementById("finalScoreText").innerText = "कुल स्कोर: " + score;
            document.getElementById("finalResultMsg").innerText = "डेटा सेव हो रहा है...";

            let payload = {
                playerName: playerName,
                score: score
            };

            fetch(scriptURL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.result === "Winner") {
                    document.getElementById("finalResultMsg").innerText = "🎉 बधाई हो! आप जीत गए (Winner)!";
                    document.getElementById("finalResultMsg").style.color = "green";
                } else {
                    document.getElementById("finalResultMsg").innerText = "❌ आप हार गए (Loss)। अगली बार कोशिश करें!";
                    document.getElementById("finalResultMsg").style.color = "red";
                }
            })
            .catch(err => {
                if (score >= 150) {
                    document.getElementById("finalResultMsg").innerText = "🎉 बधाई हो! आप जीत गए (Winner)!";
                    document.getElementById("finalResultMsg").style.color = "green";
                } else {
                    document.getElementById("finalResultMsg").innerText = "❌ आप हार गए (Loss)।";
                    document.getElementById("finalResultMsg").style.color = "red";
                }
            });
        }
    </script>
</body>
</html>
