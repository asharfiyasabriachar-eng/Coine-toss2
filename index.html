<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>कॉइन टॉस गेम</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
            width: 320px;
        }
        .coin {
            font-size: 70px;
            margin: 20px 0;
            transition: transform 0.5s ease;
        }
        @keyframes flip {
            0% { transform: rotateY(0deg); }
            50% { transform: rotateY(720deg) scale(1.1); }
            100% { transform: rotateY(1440deg); }
        }
        .flipping {
            animation: flip 1s ease-in-out;
        }
        input[type="text"] {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-top: 10px;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .choice-btn {
            background-color: #007bff;
            margin: 5px 5px;
            width: 42%;
            display: inline-block;
        }
        .choice-btn.selected {
            background-color: #ffc107;
            color: black;
            font-weight: bold;
        }
        #gameArea, #nameArea {
            display: none;
        }
        .choices-container {
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- नाम दर्ज करने की स्क्रीन (सिर्फ पहली बार दिखेगी) -->
        <div id="nameArea">
            <h2>कॉइन टॉस गेम</h2>
            <p>कृपया अपना नाम दर्ज करें:</p>
            <input type="text" id="playerName" placeholder="अपना नाम लिखें">
            <button onclick="savePlayerName()">आगे बढ़ें</button>
            <p id="nameMsg" style="color: red; font-size: 14px;"></p>
        </div>

        <!-- गेम और टॉस स्क्रीन (नाम डालने के बाद हमेशा यही दिखेगी) -->
        <div id="gameArea">
            <h2>कॉइन टॉस</h2>
            <div id="coinElement" class="coin">🪙</div>
            <p id="instructionText">अपनी पसंद चुनें:</p>
            
            <div class="choices-container" id="choiceButtonsContainer">
                <button class="choice-btn" id="headBtn" onclick="selectChoice('Head')">Head</button>
                <button class="choice-btn" id="tailBtn" onclick="selectChoice('Tail')">Tail</button>
            </div>

            <!-- टॉस्ट बटन -->
            <button id="tossBtn" onclick="performToss()" style="background-color: #ff5722; display: none;">Toss (टॉस करें)</button>

            <h3 id="statusMessage" style="margin-top: 20px; color: #333;"></h3>
        </div>
    </div>

    <script>
        const scriptURL = "https://script.google.com/macros/s/AKfycbxn6PU66vb9_sbVQ064q4WHi1eCm4P6qS6jVf0o-JxTyXEPWP_MBYH59OYahGZOzf-l_A/exec";
        let currentName = localStorage.getItem("game_player_name") || "";
        let selectedOption = "";
        let checkInterval = null;

        window.onload = function() {
            if (currentName.trim() !== "") {
                // अगर नाम पहले से सेव है, तो नाम वाला बॉक्स बिल्कुल मत दिखाओ, सीधे गेम दिखाओ
                checkExistingStatus();
            } else {
                // अगर पहली बार आया है, तो ही नाम वाला बॉक्स दिखाओ
                document.getElementById("nameArea").style.display = "block";
            }
        };

        // सिर्फ पहली बार नाम सेव करने के लिए
        function savePlayerName() {
            let nameInput = document.getElementById("playerName").value.trim();
            if (!nameInput) {
                document.getElementById("nameMsg").innerText = "कृपया अपना नाम लिखें!";
                return;
            }
            
            currentName = nameInput;
            localStorage.setItem("game_player_name", currentName);
            document.getElementById("nameMsg").innerText = "कनेक्ट हो रहा है...";

            fetch(`${scriptURL}?name=` + encodeURIComponent(currentName))
            .then(res => res.json())
            .then(data => {
                if (!data || data.length === 0) {
                    let newData = {
                        playerName: currentName,
                        playerChoice: "",
                        playerResult: ""
                    };
                    return fetch(scriptURL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify(newData)
                    });
                }
            })
            .then(() => {
                checkExistingStatus();
            })
            .catch(() => {
                showGameScreen("", "");
            });
        }

        // यूजर का स्टेटस चेक करना
        function checkExistingStatus() {
            fetch(`${scriptURL}?name=` + encodeURIComponent(currentName) + `&t=` + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                if (data && data.length > 0) {
                    let user = data[0];
                    let choice = (user.playerChoice || "").toString().trim();
                    let result = (user.playerResult || "").toString().trim();
                    
                    showGameScreen(choice, result);
                } else {
                    showGameScreen("", "");
                }
            })
            .catch(() => {
                showGameScreen("", "");
            });
        }

        // गेम स्क्रीन दिखाना (नाम वाला बॉक्स यहाँ कभी नहीं आएगा)
        function showGameScreen(choice, result) {
            document.getElementById("nameArea").style.display = "none";
            document.getElementById("gameArea").style.display = "block";

            let headBtn = document.getElementById("headBtn");
            let tailBtn = document.getElementById("tailBtn");
            let tossBtn = document.getElementById("tossBtn");
            let statusMsg = document.getElementById("statusMessage");
            let instruction = document.getElementById("instructionText");

            if (result !== "") {
                headBtn.disabled = true;
                tailBtn.disabled = true;
                tossBtn.style.display = "none";
                instruction.style.display = "none";

                if (result.toLowerCase() === "win") {
                    statusMsg.innerHTML = "🎉 बधाई हो! आप जीत गए हैं (Win)!";
                    statusMsg.style.color = "green";
                } else {
                    statusMsg.innerHTML = "❌ आप हार गए हैं (Loss)।";
                    statusMsg.style.color = "red";
                }
                if (checkInterval) clearInterval(checkInterval);
            } 
            else if (choice !== "") {
                headBtn.disabled = true;
                tailBtn.disabled = true;
                tossBtn.style.display = "none";
                instruction.style.display = "none";
                
                statusMsg.innerHTML = "⏳ Waiting for Result... (कृपया इंतज़ार करें)";
                statusMsg.style.color = "orange";
                
                startPollingResult();
            } 
            else {
                headBtn.disabled = false;
                tailBtn.disabled = false;
                tossBtn.style.display = "none";
                instruction.style.display = "block";
                statusMsg.innerHTML = "";
            }
        }

        // Head या Tail चुनना
        function selectChoice(choice) {
            selectedOption = choice;
            let headBtn = document.getElementById("headBtn");
            let tailBtn = document.getElementById("tailBtn");
            let tossBtn = document.getElementById("tossBtn");

            if (choice === "Head") {
                headBtn.classList.add("selected");
                tailBtn.classList.remove("selected");
            } else {
                tailBtn.classList.add("selected");
                headBtn.classList.remove("selected");
            }

            tossBtn.style.display = "block";
        }

        // टॉस बटन दबाना
        function performToss() {
            if (!selectedOption) return;

            let coin = document.getElementById("coinElement");
            let headBtn = document.getElementById("headBtn");
            let tailBtn = document.getElementById("tailBtn");
            let tossBtn = document.getElementById("tossBtn");
            let statusMsg = document.getElementById("statusMessage");

            headBtn.disabled = true;
            tailBtn.disabled = true;
            tossBtn.style.display = "none";
            document.getElementById("instructionText").style.display = "none";

            coin.classList.add("flipping");
            statusMsg.innerHTML = "🪙 सिक्का घूम रहा है...";
            statusMsg.style.color = "#007bff";

            let updateData = {
                playerName: currentName,
                playerChoice: selectedOption,
                playerResult: ""
            };

            setTimeout(() => {
                coin.classList.remove("flipping");

                fetch(scriptURL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(updateData)
                })
                .then(() => {
                    statusMsg.innerHTML = "⏳ Waiting for Result...";
                    statusMsg.style.color = "orange";
                    startPollingResult();
                })
                .catch(() => {
                    statusMsg.innerHTML = "⏳ Waiting for Result...";
                    statusMsg.style.color = "orange";
                    startPollingResult();
                });
            }, 1000);
        }

        // रिजल्ट चेक करना
        function startPollingResult() {
            if (checkInterval) clearInterval(checkInterval);

            checkInterval = setInterval(() => {
                fetch(`${scriptURL}?name=` + encodeURIComponent(currentName) + `&t=` + new Date().getTime())
                .then(res => res.json())
                .then(data => {
                    if (data && data.length > 0) {
                        let user = data[0];
                        let result = (user.playerResult || "").toString().trim();

                        if (result !== "") {
                            clearInterval(checkInterval);
                            showGameScreen(user.playerChoice, result);
                        }
                    }
                })
                .catch(e => {});
            }, 3000);
        }
    </script>
</body>
</html>
