<!DOCTYPE html>
<html>

<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JSFiddle kcpa5gsL</title>

  <style>
    body {
    font-family: Arial, sans-serif;
      background-color: #f4f4f9;
        text-align: center;
          padding: 20px;
          }
          .game-container {
            max-width: 300px;
              margin: auto;
                background: white;
                  padding: 20px;
                    border-radius: 12px;
                      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
                      }
                      .coin-box {
                        perspective: 1000px;
                          margin: 20px auto;
                            width: 100px;
                              height: 100px;
                              }
                              .coin {
                                width: 100%;
                                  height: 100%;
                                    position: relative;
                                      transform-style: preserve-3d;
                                        transition: transform 1s ease-in-out;
                                        }
                                        .side {
                                          position: absolute;
                                            width: 100%;
                                              height: 100%;
                                                border-radius: 50%;
                                                  background: gold;
                                                    display: flex;
                                                      align-items: center;
                                                        justify-content: center;
                                                          font-weight: bold;
                                                            font-size: 16px;
                                                              border: 3px solid orange;
                                                                backface-visibility: hidden;
                                                                }
                                                                .tails {
                                                                  transform: rotateY(180deg);
                                                                    background: silver;
                                                                      border-color: gray;
                                                                      }
                                                                      .choice-buttons button {
                                                                        padding: 8px 15px;
                                                                          margin: 5px;
                                                                            cursor: pointer;
                                                                              border: none;
                                                                                border-radius: 5px;
                                                                                  background: #ddd;
                                                                                  }
                                                                                  .choice-buttons button.active {
                                                                                    background: #007bff;
                                                                                      color: white;
                                                                                      }
                                                                                      #tossBtn {
                                                                                        margin-top: 15px;
                                                                                          padding: 10px 20px;
                                                                                            background: #28a745;
                                                                                              color: white;
                                                                                                border: none;
                                                                                                  border-radius: 5px;
                                                                                                    font-size: 16px;
                                                                                                      cursor: pointer;
                                                                                                        width: 100%;
                                                                                                        }
                                                                                                        
}
  </style>

  
</head>
<body>
  <div class="game-container">
  <h2>Coin Toss Game</h2>
  <div class="coin-box">
    <div id="coin" class="coin">
      <div class="side heads">Head</div>
      <div class="side tails">Tail</div>
    </div>
  </div>

  <div class="choice-buttons">
    <button id="headBtn" onclick="setChoice('Head')">Choose Head</button>
    <button id="tailBtn" onclick="setChoice('Tail')">Choose Tail</button>
  </div>

  <p>Your Choice: <span id="selectedChoice">None</span></p>
  <button id="tossBtn" onclick="tossCoin()">Toss Coin</button>
</div>

<script> 
let playerChoice = "";
let isWaitingForResult = false;

function setChoice(choice) {
  playerChoice = choice;
  document.getElementById("selectedChoice").innerText = choice;
  document.getElementById("headBtn").classList.remove("active");
  document.getElementById("tailBtn").classList.remove("active");
  
  if(choice === 'Head') {
      document.getElementById("headBtn").classList.add("active");
  } else {
      document.getElementById("tailBtn").classList.add("active");
  }
}

function tossCoin() {
  if(!playerChoice) {
      alert("Please choose Head or Tail first!");
      return;
  }
  
  if(isWaitingForResult) return;
  isWaitingForResult = true;
    
  let coin = document.getElementById("coin");
  coin.style.transition = "transform 0.1s linear";
  coin.style.transform = "rotateY(720deg)";
  
  let messageData = "Choice," + playerChoice; 
  if (window.ReactNativeWebView) {
      window.ReactNativeWebView.postMessage(messageData);
  }
  
  document.getElementById("selectedChoice").innerText = playerChoice + " (Waiting for result...)";
}

function handleResult(result) {
  let coin = document.getElementById("coin");
  coin.style.transition = "transform 1s ease-in-out";
  
  if (result === "Winner") {
      coin.style.transform = (playerChoice === 'Head') ? "rotateY(0deg)" : "rotateY(180deg)";
      alert("Congratulations! You WON!");
  } else if (result === "Loser") {
      coin.style.transform = (playerChoice === 'Head') ? "rotateY(180deg)" : "rotateY(0deg)";
      alert("You Lost!");
  }
  isWaitingForResult = false;
}

document.addEventListener("message", function(event) { handleResult(event.data); });
window.addEventListener("message", function(event) { handleResult(event.data); });

</script>

</body>
</html>
