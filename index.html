<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mine Island - Ultimate Game</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .card {
            background: rgba(15, 23, 42, 0.95);
            padding: 18px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            width: 360px;
            text-align: center;
            border: 3px solid #facc15;
        }
        h2 { 
            margin-top: 0; 
            color: #facc15; 
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* असली स्क्रीनशॉट जैसा बीच और समुद्र का बैकग्राउंड एरेना[span_4](start_span)[span_4](end_span) */
        .game-arena {
            background: linear-gradient(to bottom, #38bdf8 45%, #eab308 45%);
            border: 3px solid #facc15;
            border-radius: 16px;
            height: 260px;
            position: relative;
            margin: 12px 0;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }
        
        /* स्क्रीनशॉट की तरह स्टेप्स वाले बैज[span_5](start_span)[span_5](end_span) */
        .island-steps {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            pointer-events: none;
            padding: 8px 0;
        }
        .step-badge {
            background: rgba(255, 255, 255, 0.9);
            color: #1e293b;
            padding: 3px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 12px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
            border: 2px solid #ea580c;
        }

        /* कैरेक्टर */
        #character {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 34px;
            transition: bottom 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: bold;
            background: rgba(255,255,255,0.1);
            padding: 8px 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            color: #facc15;
        }

        .action-btn {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #fff;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.4);
            transition: 0.2s;
        }
        .action-btn:hover {
            transform: translateY(-2px);
        }
        .jump-btn {
            background: linear-gradient(135deg, #f97316, #ea580c);
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.4);
        }
        
        input[type="text"] {
            width: 85%;
            padding: 10px;
            margin: 8px 0;
            border: 2px solid #facc15;
            background: #020617;
            color: #fff;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            outline: none;
        }
        select {
            padding: 8px;
            width: 65%;
            margin-top: 5px;
            border-radius: 8px;
            background: #020617;
            color: #fff;
            border: 2px solid #facc15;
            font-size: 14px;
        }
        #gameScreen, #resultScreen { display: none; }
        
        .message-box {
            font-size: 13px;
            font-weight: bold;
            margin: 5px 0;
            color: #fde047;
            min-height: 20px;
            background: rgba(0,0,0,0.4);
            padding: 5px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- नाम और कैरेक्टर चयन स्क्रीन -->
        <div id="nameScreen">
            <h2>Mine Island</h2>
            <p style="font-size: 13px; color: #94a3b8;">समुद्र तट से छलांग लगाएं, फिक्स 20 स्कोर पूरा करें!</p>
            <input type="text" id="usernameInput" placeholder="अपना नाम दर्ज करें">
            
            <div style="margin: 8px 0;">
                <label style="font-size: 12px; color: #94a3b8;">कैरेक्टर चुनें:</label><br>
                <select id="charSelect">
                    <option value="🦘">कंगारू (Kangaroo)</option>
                    <option value="🦊">लोमड़ी (Fox)</option>
                </select>
            </div>

            <button class="action-btn" onclick="startGame()">गेम शुरू करें</button>
            <p id="nameError" style="color: #f87171; font-size: 11px; margin-top: 5px;"></p>
        </div>

        <!-- गेम खेलने की स्क्रीन -->
        <div id="gameScreen">
            <div class="stats-bar">
                <span>⏱️ टाइम: <span id="timerText">60</span>s</span>
                <span>🏆 स्कोर: <span id="scoreText">0</span>/20</span>
            </div>

            <div class="message-box" id="instructionText">बटन दबाकर छलांग लगाएं!</div>
            
            <div class="game-arena">
                <!-- स्क्रीनशॉट की तरह सीढ़ियों वाले लेवल्स (स्टेप्स)[span_6](start_span)[span_6](end_span) -->
                <div class="island-steps">
                    <span class="step-badge">स्तर 3 (उच्च छलांग)</span>
                    <span class="step-badge">स्तर 2 (मध्यम छलांग)</span>
                    <span class="step-badge">स्तर 1 (शुरुआत)</span>
                </div>
                <div id="character">🦘</div>
            </div>

            <button class="action-btn jump-btn" onclick="jumpAction()">🚀 छलांग लगाएं (Jump)</button>
        </div>

        <!-- रिजल्ट स्क्रीन -->
        <div id="resultScreen">
            <h2>गेम समाप्त!</h2>
            <p id="finalResultMsg" style="font-size: 15px; font-weight: bold; margin: 12px 0;"></p>
            <button class="action-btn" onclick="restartGame()">फिर से खेलें (Play Again)</button>
        </div>
    </div>

    <script>
        const scriptURL = "https://script.google.com/macros/s/AKfycbwKr3-nGqxHtODqv-gf5Hx_MtwmXgHL03Cw5RxUCHgFUw1n_W02SOtixct5Qa01RqnO5w/exec";
        
        let playerName = "";
        let selectedEmoji = "🦘";
        let score = 0;
        let targetScore = 20; // फिक्स स्कोर 20
        let timeLeft = 60; 
        let timerInterval = null;
        let gameActive = false;
        let currentPos = 15;

        function startGame() {
            let val = document.getElementById("usernameInput").value.trim();
            if (!val) {
                document.getElementById("nameError").innerText = "कृपया अपना नाम लिखें!";
                return;
            }
            playerName = val;
            selectedEmoji = document.getElementById("charSelect").value;
            document.getElementById("character").innerText = selectedEmoji;

            document.getElementById("nameError").innerText = "";
            document.getElementById("nameScreen").style.display = "none";
            document.getElementById("resultScreen").style.display = "none";
            document.getElementById("gameScreen").style.display = "block";

            resetGameState();
            startTimer();
        }

        function startTimer() {
            gameActive = true;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById("timerText").innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    gameActive = false;
                    endGame("Loss", "⏰ समय समाप्त! आप हार गए।");
                }
            }, 1000);
        }

        function resetGameState() {
            score = 0;
            timeLeft = 60;
            currentPos = 15;
            document.getElementById("scoreText").innerText = score;
            document.getElementById("timerText").innerText = timeLeft;
            document.getElementById("character").style.bottom = currentPos + "px";
            document.getElementById("character").innerText = selectedEmoji;
            document.getElementById("instructionText").style.color = "#fde047";
            document.getElementById("instructionText").innerText = "बटन दबाकर छलांग लगाएं!";
        }

        function jumpAction() {
            if (!gameActive) return;

            // 25% चांस पानी में फिसलने का
            let isSlip = Math.random() < 0.25; 

            if (!isSlip) {
                // यहाँ रैंडम स्कोर (1, 2 या 3) जुड़ रहा है जैसा आपने कहा
                let earned = Math.floor(Math.random() * 3) + 1;
                score += earned;
                if (score > targetScore) score = targetScore;

                document.getElementById("scoreText").innerText = score;
                
                currentPos += 12;
                if (currentPos > 210) currentPos = 210;
                document.getElementById("character").style.bottom = currentPos + "px";
                document.getElementById("instructionText").style.color = "#4ade80";
                document.getElementById("instructionText").innerText = `✨ शानदार! +${earned} स्कोर मिला।`;

                if (score >= targetScore) {
                    clearInterval(timerInterval);
                    gameActive = false;
                    endGame("Winner", `🎉 बधाई हो! आपने फिक्स ${targetScore} स्कोर का टारगेट जीत लिया!`);
                }
            } else {
                // पानी में पैर फिसलने पर बिना पॉप-अप के स्क्रीन के अंदर मैसेज और रीसेट
                clearInterval(timerInterval);
                gameActive = false;

                document.getElementById("character").style.bottom = "10px";
                document.getElementById("character").innerText = "🌊";
                document.getElementById("instructionText").style.color = "#f87171";
                document.getElementById("instructionText").innerText = "💦 पैर फिसल गया! पानी में गिरे, गेम रीसेट हो रहा है...";

                sendDataToServer("Loss");

                setTimeout(() => {
                    resetGameState();
                    startTimer();
                }, 1500);
            }
        }

        function endGame(status, msg) {
            gameActive = false;
            document.getElementById("gameScreen").style.display = "none";
            document.getElementById("resultScreen").style.display = "block";
            document.getElementById("finalResultMsg").innerText = msg;
            
            if (status === "Winner") {
                document.getElementById("finalResultMsg").style.color = "#4ade80";
            } else {
                document.getElementById("finalResultMsg").style.color = "#f87171";
            }

            sendDataToServer(status);
        }

        function sendDataToServer(resultStatus) {
            let payload = {
                playerName: playerName,
                result: resultStatus
            };

            fetch(scriptURL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .catch(err => console.log("Data sync error"));
        }

        function restartGame() {
            document.getElementById("resultScreen").style.display = "none";
            document.getElementById("nameScreen").style.display = "block";
        }
    </script>
</body>
</html>
