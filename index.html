<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Shuffling Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a2e;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #16213e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 8px 25px rgba(0, 0, 0, 0.5);
            width: 360px;
            text-align: center;
        }
        h2 { margin-top: 0; color: #e94560; }
        p { color: #ccc; font-size: 14px; }
        
        /* 4 कप/बॉक्स की डिजाइन */
        .cups-container {
            display: flex;
            justify-content: space-around;
            margin: 30px 0;
        }
        .cup {
            width: 65px;
            height: 65px;
            background-color: #0f3460;
            border: 2px solid #e94560;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: pointer;
            transition: 0.3s;
        }
        .cup.disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }
        .cup:hover:not(.disabled) {
            background-color: #e94560;
            transform: translateY(-5px);
        }
        .cup.reveal {
            background-color: #f39c12;
        }

        .action-btn {
            background-color: #4ecca3;
            color: #1a1a2e;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        input[type="text"] {
            width: 90%;
            padding: 10px;
            margin: 15px 0;
            border: 1px solid #4ecca3;
            background: #0f3460;
            color: #fff;
            border-radius: 5px;
            text-align: center;
            font-size: 16px;
        }
        #gameScreen, #resultScreen { display: none; }
        .message-box {
            font-size: 18px;
            font-weight: bold;
            margin: 15px 0;
            color: #f39c12;
            min-height: 25px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- नाम दर्ज करने की स्क्रीन -->
        <div id="nameScreen">
            <h2>Coin Shuffle Game</h2>
            <p>सिक्के को पहचानें और जीतें!</p>
            <input type="text" id="usernameInput" placeholder="अपना नाम दर्ज करें">
            <button class="action-btn" onclick="startShuffleRound()">गेम शुरू करें</button>
            <p id="nameError" style="color: #ff6b6b; font-size: 13px;"></p>
        </div>

        <!-- गेम खेलने की स्क्रीन -->
        <div id="gameScreen">
            <h2>हेयर-फेर (Shuffle)</h2>
            <div class="message-box" id="instructionText">सिक्का ध्यान से देखें...</div>
            
            <div class="cups-container">
                <div class="cup disabled" id="cup0" onclick="chooseCup(0)">?</div>
                <div class="cup disabled" id="cup1" onclick="chooseCup(1)">?</div>
                <div class="cup disabled" id="cup2" onclick="chooseCup(2)">?</div>
                <div class="cup disabled" id="cup3" onclick="chooseCup(3)">?</div>
            </div>
        </div>

        <!-- रिजल्ट स्क्रीन -->
        <div id="resultScreen">
            <h2>गेम समाप्त!</h2>
            <p id="finalResultMsg" style="font-size: 20px; font-weight: bold; margin: 20px 0;"></p>
            <button class="action-btn" onclick="restartGame()">फिर से खेलें (Play Again)</button>
        </div>
    </div>

    <script>
        const scriptURL = "https://script.google.com/macros/s/AKfycbwNPNzL1pZLz8ZbgRCBpfgQPdVVVaYyu3bNccTLYnNYk6J0_g_Kvp9Jm0AMzWCema_JpA/exec";
        
        let playerName = "";
        let winningCup = -1;
        let gameActive = false;

        function startShuffleRound() {
            let val = document.getElementById("usernameInput").value.trim();
            if (!val) {
                document.getElementById("nameError").innerText = "कृपया सही नाम लिखें!";
                return;
            }
            playerName = val;
            document.getElementById("nameError").innerText = "";
            document.getElementById("nameScreen").style.display = "none";
            document.getElementById("resultScreen").style.display = "none";
            document.getElementById("gameScreen").style.display = "block";

            resetCups();
            
            winningCup = Math.floor(Math.random() * 4);
            
            document.getElementById("cup" + winningCup).innerText = "🪙";
            document.getElementById("instructionText").innerText = "सिक्का इस कप में है! याद रखें...";

            // 2 सेकंड बाद सिक्का छिपाकर हेयर-फेर शुरू होगा
            setTimeout(() => {
                document.getElementById("cup" + winningCup).innerText = "?";
                document.getElementById("instructionText").innerText = "हेयर-फेर हो रहा है... ध्यान दें!";
                
                let shuffleCount = 0;
                let shuffleInterval = setInterval(() => {
                    let randomFake = Math.floor(Math.random() * 4);
                    document.querySelectorAll('.cup').forEach(c => {
                        c.style.borderColor = "#e94560";
                        c.classList.add('disabled'); // हेयर-फेर के दौरान क्लिक बंद रखना
                    });
                    document.getElementById("cup" + randomFake).style.borderColor = "#4ecca3";
                    
                    shuffleCount++;
                    if (shuffleCount > 10) { // हेयर-फेर पूरा होने का समय
                        clearInterval(shuffleInterval);
                        document.querySelectorAll('.cup').forEach(c => {
                            c.style.borderColor = "#e94560";
                            c.classList.remove('disabled'); // अब यूजर क्लिक कर सकता है
                        });
                        document.getElementById("instructionText").innerText = "अब सही बॉक्स चुनें!";
                        gameActive = true; // क्लिक करने की अनुमति अब मिलेगी
                    }
                }, 250);

            }, 2000);
        }

        function resetCups() {
            gameActive = false;
            for(let i=0; i<4; i++) {
                let c = document.getElementById("cup" + i);
                c.innerText = "?";
                c.classList.remove('reveal');
                c.classList.add('disabled');
                c.style.borderColor = "#e94560";
            }
        }

        function chooseCup(selectedCup) {
            if (!gameActive) return; // अगर गेम एक्टिव नहीं है तो क्लिक काम नहीं करेगा
            gameActive = false; // दोबारा क्लिक रोकने के लिए

            // सभी कप लॉक कर दें ताकि क्लिक न हो सके
            document.querySelectorAll('.cup').forEach(c => c.classList.add('disabled'));

            for(let i=0; i<4; i++) {
                if (i === winningCup) {
                    document.getElementById("cup" + i).innerText = "🪙";
                    document.getElementById("cup" + i).classList.add('reveal');
                } else {
                    document.getElementById("cup" + i).innerText = "❌";
                }
            }

            let resultStatus = (selectedCup === winningCup) ? "Winner" : "Loss";

            if (resultStatus === "Winner") {
                document.getElementById("instructionText").innerText = "🎉 सही जवाब! आप जीत गए!";
                document.getElementById("instructionText").style.color = "#4ecca3";
            } else {
                document.getElementById("instructionText").innerText = "❌ गलत बॉक्स! आप हार गए!";
                document.getElementById("instructionText").style.color = "#ff6b6b";
            }

            setTimeout(() => {
                sendDataToServer(resultStatus);
            }, 2000);
        }

        function sendDataToServer(resultStatus) {
            document.getElementById("gameScreen").style.display = "none";
            document.getElementById("resultScreen").style.display = "block";
            document.getElementById("finalResultMsg").innerText = "डेटा सेव हो रहा है...";

            let payload = {
                playerName: playerName,
                result: resultStatus
            };

            fetch(scriptURL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.result === "Winner") {
                    document.getElementById("finalResultMsg").innerText = "🎉 बधाई हो! आप जीत गए (Winner)!";
                    document.getElementById("finalResultMsg").style.color = "#4ecca3";
                } else {
                    document.getElementById("finalResultMsg").innerText = "❌ आप हार गए (Loss)। अगली बार कोशिश करें!";
                    document.getElementById("finalResultMsg").style.color = "#ff6b6b";
                }
            })
            .catch(err => {
                if (resultStatus === "Winner") {
                    document.getElementById("finalResultMsg").innerText = "🎉 बधाई हो! आप जीत गए (Winner)!";
                    document.getElementById("finalResultMsg").style.color = "#4ecca3";
                } else {
                    document.getElementById("finalResultMsg").innerText = "❌ आप हार गए (Loss)।";
                    document.getElementById("finalResultMsg").style.color = "#ff6b6b";
                }
            });
        }

        function restartGame() {
            document.getElementById("resultScreen").style.display = "none";
            document.getElementById("gameScreen").style.display = "block";
            startShuffleRound();
        }
    </script>
</body>
</html>
