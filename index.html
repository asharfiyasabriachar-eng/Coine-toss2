<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Toss Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
            width: 320px;
            text-align: center;
        }
        h2 {
            margin-top: 0;
            color: #111;
        }
        .coin {
            width: 100px;
            height: 100px;
            background-color: #ffc107;
            border-radius: 50%;
            margin: 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            color: #000;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
            transition: transform 0.6s ease;
        }
        @keyframes spin {
            0% { transform: rotateY(0deg); }
            50% { transform: rotateY(720deg) scale(1.1); }
            100% { transform: rotateY(1440deg); }
        }
        .spinning {
            animation: spin 1s ease-in-out;
        }
        .btn-group {
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
        }
        .action-btn {
            background-color: #e0e0e0;
            color: #333;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            width: 48%;
        }
        .action-btn.active {
            background-color: #333;
            color: white;
        }
        .toss-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-top: 10px;
        }
        .toss-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        input[type="text"] {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        #nameScreen {
            display: none;
        }
        #gameScreen {
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- नाम डालने की स्क्रीन (सिर्फ पहली बार) -->
        <div id="nameScreen">
            <h2>Coin Toss Game</h2>
            <p>अपना नाम दर्ज करें:</p>
            <input type="text" id="usernameInput" placeholder="नाम लिखें">
            <button class="toss-btn" onclick="saveName()">शुरू करें</button>
            <p id="nameError" style="color: red; font-size: 13px;"></p>
        </div>

        <!-- मुख्य गेम स्क्रीन (स्क्रीनशॉट जैसी) -->
        <div id="gameScreen">
            <h2>Coin Toss Game</h2>
            
            <div class="coin" id="coinDisplay">Head</div>

            <div class="btn-group">
                <button class="action-btn" id="chooseHeadBtn" onclick="selectChoice('Head')">Choose Head</button>
                <button class="action-btn" id="chooseTailBtn" onclick="selectChoice('Tail')">Choose Tail</button>
            </div>

            <p id="choiceText" style="font-weight: bold; margin: 15px 0;">Your Choice: None</p>

            <button class="toss-btn" id="tossButton" onclick="startToss()" disabled>Toss Coin</button>

            <p id="statusMsg" style="margin-top: 15px; font-weight: bold; color: #555;"></p>
        </div>
    </div>

    <script>
        const scriptURL = "https://script.google.com/macros/s/AKfycbxn6PU66vb9_sbVQ064q4WHi1eCm4P6qS6jVf0o-JxTyXEPWP_MBYH59OYahGZOzf-l_A/exec";
        let playerName = localStorage.getItem("my_game_user") || "";
        let chosenSide = "";
        let pollInterval = null;

        window.onload = function() {
            if (playerName.trim() !== "") {
                document.getElementById("gameScreen").style.display = "block";
                checkServerStatus();
            } else {
                document.getElementById("nameScreen").style.display = "block";
            }
        };

        function saveName() {
            let val = document.getElementById("usernameInput").value.trim();
            if (!val) {
                document.getElementById("nameError").innerText = "कृपया नाम लिखें!";
                return;
            }
            playerName = val;
            localStorage.setItem("my_game_user", playerName);
            
            document.getElementById("nameScreen").style.display = "none";
            document.getElementById("gameScreen").style.display = "block";

            // शीट में नया यूजर जोड़ने के लिए
            fetch(scriptURL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ playerName: playerName, playerChoice: "", playerResult: "" })
            }).catch(e => {});
        }

        function selectChoice(side) {
            chosenSide = side;
            document.getElementById("choiceText").innerText = "Your Choice: " + side;
            document.getElementById("coinDisplay").innerText = side;

            if (side === "Head") {
                document.getElementById("chooseHeadBtn").classList.add("active");
                document.getElementById("chooseTailBtn").classList.remove("active");
            } else {
                document.getElementById("chooseTailBtn").classList.add("active");
                document.getElementById("chooseHeadBtn").classList.remove("active");
            }

            // टॉस बटन चालू करें
            document.getElementById("tossButton").disabled = false;
        }

        function startToss() {
            if (!chosenSide) return;

            let coin = document.getElementById("coinDisplay");
            let tossBtn = document.getElementById("tossButton");
            let headBtn = document.getElementById("chooseHeadBtn");
            let tailBtn = document.getElementById("chooseTailBtn");
            let statusMsg = document.getElementById("statusMsg");

            // बटन और विकल्प लॉक करें
            tossBtn.disabled = true;
            headBtn.disabled = true;
            tailBtn.disabled = true;

            // सिक्का घुमाना शुरू करें
            coin.classList.add("spinning");
            statusMsg.innerText = "सिक्का घूम रहा है...";
            statusMsg.style.color = "#007bff";

            let payload = {
                playerName: playerName,
                playerChoice: chosenSide,
                playerResult: ""
            };

            setTimeout(() => {
                coin.classList.remove("spinning");

                // गूगल शीट में चॉइस भेजें
                fetch(scriptURL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(payload)
                })
                .then(() => {
                    // अब सिर्फ यह लिखा आना चाहिए
                    statusMsg.innerText = "Waiting for Result...";
                    statusMsg.style.color = "orange";
                    startPolling();
                })
                .catch(() => {
                    statusMsg.innerText = "Waiting for Result...";
                    statusMsg.style.color = "orange";
                    startPolling();
                });
            }, 1000);
        }

        function checkServerStatus() {
            fetch(`${scriptURL}?name=` + encodeURIComponent(playerName) + `&t=` + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                if (data && data.length > 0) {
                    let user = data[0];
                    let resVal = (user.playerResult || "").toString().trim();
                    let choiceVal = (user.playerChoice || "").toString().trim();

                    if (resVal !== "") {
                        showFinalResult(resVal);
                    } else if (choiceVal !== "") {
                        // अगर पहले ही चॉइस दी जा चुकी है और रिजल्ट बाकी है
                        selectChoice(choiceVal);
                        document.getElementById("chooseHeadBtn").disabled = true;
                        document.getElementById("chooseTailBtn").disabled = true;
                        document.getElementById("tossButton").disabled = true;
                        document.getElementById("statusMsg").innerText = "Waiting for Result...";
                        document.getElementById("statusMsg").style.color = "orange";
                        startPolling();
                    }
                }
            }).catch(e => {});
        }

        function startPolling() {
            if (pollInterval) clearInterval(pollInterval);

            pollInterval = setInterval(() => {
                fetch(`${scriptURL}?name=` + encodeURIComponent(playerName) + `&t=` + new Date().getTime())
                .then(res => res.json())
                .then(data => {
                    if (data && data.length > 0) {
                        let resVal = (data[0].playerResult || "").toString().trim();
                        if (resVal !== "") {
                            clearInterval(pollInterval);
                            showFinalResult(resVal);
                        }
                    }
                }).catch(e => {});
            }, 3000);
        }

        function showFinalResult(resVal) {
            let statusMsg = document.getElementById("statusMsg");
            if (resVal.toLowerCase() === "win") {
                statusMsg.innerText = "बधाई हो! आप जीत गए हैं (Win)!";
                statusMsg.style.color = "green";
            } else {
                statusMsg.innerText = "आप हार गए हैं (Loss)।";
                statusMsg.style.color = "red";
            }
        }
    </script>
</body>
</html>
