<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mine Island - Game</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3799, #0984e3);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .card {
            background: rgba(15, 23, 42, 0.95);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
            width: 380px;
            text-align: center;
            border: 3px solid #f1c40f;
        }
        h2 { 
            margin-top: 0; 
            color: #f1c40f; 
            font-size: 26px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(241, 196, 15, 0.6);
        }
        
        /* स्क्रीनशॉट जैसा बीच और पानी का बैकग्राउंड एरेना */
        .game-arena {
            background: linear-gradient(to bottom, #4aa3df 45%, #e1b12c 45%);
            border: 3px solid #f1c40f;
            border-radius: 12px;
            height: 260px;
            position: relative;
            margin: 15px 0;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        
        .island-steps {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            pointer-events: none;
            padding: 10px 0;
        }
        .step-badge {
            background: rgba(255, 255, 255, 0.9);
            color: #2d3436;
            padding: 4px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            border: 2px solid #e17055;
        }

        /* कैरेक्टर */
        #character {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 36px;
            transition: bottom 0.25s ease-out;
            z-index: 10;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            font-weight: bold;
            background: rgba(255,255,255,0.1);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            color: #f1c40f;
        }

        .action-btn {
            background: linear-gradient(135deg, #00b894, #55efc4);
            color: #0f0c29;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            box-shadow: 0 5px 15px rgba(0, 184, 148, 0.4);
            transition: 0.2s;
        }
        .action-btn:hover {
            transform: scale(1.02);
            opacity: 0.95;
        }
        .jump-btn {
            background: linear-gradient(135deg, #e17055, #fab1a0);
            color: #fff;
            font-size: 18px;
            padding: 14px;
        }
        input[type="text"] {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 2px solid #f1c40f;
            background: #111827;
            color: #fff;
            border-radius: 8px;
            text-align: center;
            font-size: 15px;
            outline: none;
        }
        select {
            padding: 8px;
            width: 65%;
            margin-top: 5px;
            border-radius: 5px;
            background: #111827;
            color: #fff;
            border: 1px solid #f1c40f;
        }
        #gameScreen, #resultScreen { display: none; }
        
        .message-box {
            font-size: 14px;
            font-weight: bold;
            margin: 5px 0;
            color: #ffeaa7;
            min-height: 20px;
            background: rgba(0,0,0,0.4);
            padding: 6px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- नाम और कैरेक्टर चयन स्क्रीन -->
        <div id="nameScreen">
            <h2>Mine Island</h2>
            <p>समुद्र तट पर चढ़ाई करें, फिक्स 15 स्कोर पूरा करें!</p>
            <input type="text" id="usernameInput" placeholder="अपना नाम दर्ज करें">
            
            <div style="margin: 8px 0;">
                <label style="font-size: 13px; color: #dfe6e9;">कैरेक्टर चुनें:</label><br>
                <select id="charSelect">
                    <option value="🦘">कंगारू (Kangaroo)</option>
                    <option value="🦊">लोमड़ी (Fox)</option>
                </select>
            </div>

            <button class="action-btn" onclick="startGame()">गेम शुरू करें</button>
            <p id="nameError" style="color: #ff6b6b; font-size: 12px;"></p>
        </div>

        <!-- गेम खेलने की स्क्रीन -->
        <div id="gameScreen">
            <div class="stats-bar">
                <span>⏱️ टाइम: <span id="timerText">60</span>s</span>
                <span>🏆 स्कोर: <span id="scoreText">0</span>/15</span>
            </div>

            <div class="message-box" id="instructionText">बटन दबाकर छलांग लगाएं!</div>
            
            <div class="game-arena">
                <div class="island-steps">
                    <span class="step-badge">12 स्कोर (स्तर 3)</span>
                    <span class="step-badge">8 स्कोर (स्तर 2)</span>
                    <span class="step-badge">4 स्कोर (स्तर 1)</span>
                </div>
                <div id="character">🦘</div>
            </div>

            <button class="action-btn jump-btn" onclick="jumpAction()">🚀 छलांग लगाएं (Jump)</button>
        </div>

        <!-- रिजल्ट स्क्रीन (जीतने पर) -->
        <div id="resultScreen">
            <h2>गेम समाप्त!</h2>
            <p id="finalResultMsg" style="font-size: 16px; font-weight: bold; margin: 12px 0;"></p>
            <button class="action-btn" onclick="restartGame()">फिर से खेलें (Play Again)</button>
        </div>
    </div>

    <script>
        const scriptURL = "https://script.google.com/macros/s/AKfycbwKr3-nGqxHtODqv-gf5Hx_MtwmXgHL03Cw5RxUCHgFUw1n_W02SOtixct5Qa01RqnO5w/exec";
        
        let playerName = "";
        let selectedEmoji = "🦘";
        let score = 0;
        let targetScore = 15; // यहाँ से आप फिक्स स्कोर बदल सकते हैं (जैसे 20 करना हो तो 20 लिख लें)
        let timeLeft = 60; 
        let timerInterval = null;
        let gameActive = false;
        let currentPos = 15;

        function startGame() {
            let val = document.getElementById("usernameInput").value.trim();
            if (!val) {
                document.getElementById("nameError").innerText = "कृपया अपना नाम लिखें!";
                return;
            }
            playerName = val;
            selectedEmoji = document.getElementById("charSelect").value;
            document.getElementById("character").innerText = selectedEmoji;

            document.getElementById("nameError").innerText = "";
            document.getElementById("nameScreen").style.display = "none";
            document.getElementById("resultScreen").style.display = "none";
            document.getElementById("gameScreen").style.display = "block";

            resetGameState();
            startTimer();
        }

        function startTimer() {
            gameActive = true;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById("timerText").innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    gameActive = false;
                    endGame("Loss", "⏰ समय समाप्त! आप हार गए।");
                }
            }, 1000);
        }

        function resetGameState() {
            score = 0;
            timeLeft = 60;
            currentPos = 15;
            document.getElementById("scoreText").innerText = score;
            document.getElementById("timerText").innerText = timeLeft;
            document.getElementById("character").style.bottom = currentPos + "px";
            document.getElementById("character").innerText = selectedEmoji;
            document.getElementById("instructionText").style.color = "#ffeaa7";
            document.getElementById("instructionText").innerText = "बटन दबाकर छलांग लगाएं!";
        }

        function jumpAction() {
            if (!gameActive) return;

            let isSlip = Math.random() < 0.25; // 25% चांस पानी में फिसलने का

            if (!isSlip) {
                let earned = Math.floor(Math.random() * 3) + 1;
                score += earned;
                if (score > targetScore) score = targetScore;

                document.getElementById("scoreText").innerText = score;
                
                currentPos += 22;
                if (currentPos > 215) currentPos = 215;
                document.getElementById("character").style.bottom = currentPos + "px";
                document.getElementById("instructionText").style.color = "#55efc4";
                document.getElementById("instructionText").innerText = `✨ शानदार! +${earned} स्कोर मिला।`;

                if (score >= targetScore) {
                    clearInterval(timerInterval);
                    gameActive = false;
                    endGame("Winner", `🎉 बधाई हो! आपने फिक्स ${targetScore} स्कोर का टारगेट जीत लिया!`);
                }
            } else {
                clearInterval(timerInterval);
                gameActive = false;

                document.getElementById("character").style.bottom = "10px";
                document.getElementById("character").innerText = "🌊";
                document.getElementById("instructionText").style.color = "#ff6b6b";
                document.getElementById("instructionText").innerText = "💦 पैर फिसल गया! पानी में गिरे, गेम शुरुआत से रीसेट हो रहा है...";

                sendDataToServer("Loss");

                setTimeout(() => {
                    resetGameState();
                    startTimer();
                }, 1500);
            }
        }

        function endGame(status, msg) {
            gameActive = false;
            document.getElementById("gameScreen").style.display = "none";
            document.getElementById("resultScreen").style.display = "block";
            document.getElementById("finalResultMsg").innerText = msg;
            
            if (status === "Winner") {
                document.getElementById("finalResultMsg").style.color = "#55efc4";
            } else {
                document.getElementById("finalResultMsg").style.color = "#ff6b6b";
            }

            sendDataToServer(status);
        }

        function sendDataToServer(resultStatus) {
            let payload = {
                playerName: playerName,
                result: resultStatus
            };

            fetch(scriptURL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .catch(err => console.log("Data sync error"));
        }

        function restartGame() {
            document.getElementById("resultScreen").style.display = "none";
            document.getElementById("nameScreen").style.display = "block";
        }
    </script>
</body>
</html>
